<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0.2"/>
    </linearGradient>
  </defs>
  <!-- Background with rounded corners for maskable safety -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <!-- Glowing subtle outer shield ring -->
  <path d="M256 70 L390 120 C390 270 290 380 256 430 C222 380 122 270 122 120 Z" fill="none" stroke="url(#glow)" stroke-width="12" stroke-linejoin="round"/>
  <!-- Main Shield Body -->
  <path d="M256 90 L370 135 C370 260 282 360 256 405 C230 360 142 260 142 135 Z" fill="url(#shieldGrad)" stroke="#93c5fd" stroke-width="6" stroke-linejoin="round"/>
  <!-- Shield Internal Lock / Radar Motif -->
  <circle cx="256" cy="220" r="32" fill="#ffffff" fill-opacity="0.9"/>
  <path d="M256 250 L256 310 M236 310 L276 310" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>
  <path d="M226 220 C226 203 239 190 256 190 C273 190 286 203 286 220" fill="none" stroke="#0b1120" stroke-width="8" stroke-linecap="round"/>
</svg>
